<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FCF7F5" />
    <!-- Fonts: connect early and fetch the Arabic font in parallel with the app (display=swap: text never waits). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" /></noscript>
    <title>SaaS2 · POS for clothing shops in Lebanon</title>
    <meta name="description" content="SaaS2 is a point of sale for clothing shops in Lebanon. Sell from your phone, track sizes and colors, take USD or LBP, record debt customers, and share receipts on WhatsApp." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SaaS2 · POS for clothing shops in Lebanon" />
    <meta property="og:description" content="Sell in dollars or lira, and track every size. From your phone." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "SaaS2",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web browser",
        "description": "Point of sale for clothing shops in Lebanon: sizes and colors, USD and LBP, cash, card, Whish/OMT and debt.",
        "publisher": { "@type": "Organization", "name": "UltraScaling" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
