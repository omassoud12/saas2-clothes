# Backend tests (including the business reports on a real Postgres) and the business consistency check.
# The Postgres is the embedded local one (backend/scripts/dev-db.mjs): no secrets, no real database.
name: business-reports

on:
  push:
    branches: [main, business-reports]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate the Prisma client
        run: npm run prisma:generate --workspace server
      - name: Start the local Postgres
        working-directory: backend
        run: |
          node scripts/dev-db.mjs start > dev-db.log 2>&1 &
          for i in $(seq 1 60); do grep -q "Dev database running" dev-db.log && break; sleep 2; done
          cat dev-db.log
          if ! grep -q "Dev database running" dev-db.log; then
            tail -20 dev-db.log | while IFS= read -r line; do echo "::error::$line"; done
            echo "::error::The local Postgres did not start"; exit 1
          fi
      - name: Typecheck
        run: npm run typecheck --workspace server
      - name: Backend tests (business tests use the local Postgres)
        # Failing tests are also printed as annotations, which can be read without opening the log.
        run: |
          set +e
          npm test --workspace server 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "✖|^ *not ok|^# (pass|fail)|Error:|error TS|code: '|actual:|expected:" test.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status
      - name: All reports agree
        working-directory: backend
        run: npm run check:business
